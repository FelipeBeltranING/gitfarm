name: "GitFarm Contribution Farm"
description: "Turn your contribution graph into a pixel-art farm where a little farmer plants your commits."
author: "David Felipe Beltrán Tabares"
branding:
  icon: "sun"
  color: "green"
inputs:
  github_user_name:
    description: "GitHub username whose contributions grow on the farm."
    required: false
    default: ${{ github.repository_owner }}
  github_token:
    description: "Token used to read the contribution calendar."
    required: false
    default: ${{ github.token }}
  output:
    description: "Where to write the SVG."
    required: false
    default: "dist/farm.svg"
  crop:
    description: "auto (mix of your top languages), or up to 3 of corn, sunflower, tomato, coffee, strawberry, pumpkin, cacao, carrot, rice, wheat (comma separated)."
    required: false
    default: "auto"
  season:
    description: "none, spring, summer, autumn, winter, rainy, dry, auto (northern hemisphere) or auto-south."
    required: false
    default: "none"
  time:
    description: "auto (night farm for night owls), day or night."
    required: false
    default: "auto"
  timezone:
    description: "IANA time zone used by time: auto, e.g. America/Bogota."
    required: false
    default: "UTC"
  weather:
    description: "Drifting clouds and the occasional shower (true/false)."
    required: false
    default: "true"
  farmer_hat:
    description: "Hat color, e.g. #efc96d."
    required: false
  farmer_shirt:
    description: "Shirt color, e.g. #d9473b."
    required: false
  farmer_overalls:
    description: "Overalls color, e.g. #3d72bd."
    required: false
runs:
  using: "node24"
  main: "src/action.js"
