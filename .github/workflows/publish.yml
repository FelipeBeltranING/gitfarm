name: Publish to npm

# Runs when a GitHub release is published. Needs an NPM_TOKEN repository secret
# (an npm "automation" token for the account that owns the `gitfarm` package).
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm test
      - name: The tag must match package.json
        run: test "v$(node -p "require('./package.json').version")" = "${{ github.event.release.tag_name }}"
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
